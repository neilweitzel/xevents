[project]
name = "xevents-offline-publication-proof"
version = "0.1.0"
description = "Offline-only publication attestation verification; no live gate integration"
requires-python = ">=3.14,<3.15"
dependencies = ["cryptography==50.0.1"]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["proof.py", "github_snapshot.py"]

[tool.coverage.run]
branch = true
source = ["proof"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
]
