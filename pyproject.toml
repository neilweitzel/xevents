[project]
name = "xevents"
version = "0.1.0"
description = "Evidence-first incident-intelligence pipeline: scheduled RansomLook ingest, static GitHub Pages surface."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "structlog>=24.4.0",
    "typer>=0.15.1",
]

[project.scripts]
xevents = "xevents.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[dependency-groups]
dev = [
    "mypy>=1.14.1,<3",
    "pytest>=8.3.4",
    "ruff==0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xevents"]
