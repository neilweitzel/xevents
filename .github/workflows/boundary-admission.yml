name: Public boundary admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: boundary-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission:
    name: Boundary admission
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read trusted main only, never execute candidate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.3'
      - name: Install pinned verifier runtime
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/publication_proof/requirements-runtime.lock
      - name: Check complete public change and attestation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python tools/publication_proof/release_control.py check --pr "$PR_NUMBER" --sha "$EXPECTED_HEAD"
