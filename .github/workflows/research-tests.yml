name: Research implementation tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: research-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.3'
      - name: Install hash-locked test tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/publication_proof/requirements-test.lock
          python -m pip check
      - name: Test public admission and deployment controls
        working-directory: tools/publication_proof
        run: |
          python -m pytest -q
          ruff check .
          mypy
      - name: Preserve repository invariants
        run: |
          python -m unittest discover -s tests -q
          python -m unittest discover -s tests/invariants -q
      - name: Test aggregate reader and synthetic model
        run: |
          node --version
          npm --prefix app test

# Read-only, synthetic/offline tests. No App secret, source intake or publication.
