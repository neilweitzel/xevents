name: Verified research Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verified-research-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'neilweitzel/xevents'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pull-requests: read
      pages: write
      id-token: write
    steps:
      - name: Read exact main event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.3'
      - name: Install pinned verifier runtime
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/publication_proof/requirements-runtime.lock
      - name: Verify exact merged release and current main
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: python tools/publication_proof/release_control.py deployment --sha "$RELEASE_SHA"
      - name: Package only reviewed app and admitted public data
        if: steps.release.outputs.ready == 'true'
        run: python tools/publication_proof/package_site.py --root . --output _site
      - name: Upload verified static site
        if: steps.release.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
      - name: Recheck immediately before deployment request
        if: steps.release.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ steps.release.outputs.pr }}
        run: python tools/publication_proof/release_control.py deployment --sha "$RELEASE_SHA" --pr "$PR_NUMBER"
      - name: Deploy the verified research release
        if: steps.release.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
