name: Publish to Pages

# Safety net for the primary publish path. "Refresh" deploys Pages from
# inside itself, because its own commit is pushed with GITHUB_TOKEN and
# GitHub deliberately does not start workflows from such a push — so a
# `push` trigger here can never see the scheduled refresh.
#
# workflow_run is not subject to the GITHUB_TOKEN restriction, so it gives
# publication a second, independent path. Checking out `main` (not
# github.sha): under workflow_run, github.sha is the head of the run that
# triggered us, which for a refresh is the commit *before* it pushed its
# data — checking that out would republish the previous build.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
